frr version 10.7.0
frr defaults traditional
hostname core2
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.32/32
 ip ospf area 0.0.0.0
!
interface eth1
 description TO-AGG1-BACKUP
 ip address 10.0.2.3/31
 ip ospf area 0.0.0.0
 ip ospf cost 100
!
interface eth2
 description TO-AGG2-PRIMARY
 ip address 10.0.2.7/31
 ip ospf area 0.0.0.0
 ip ospf cost 10
!
interface eth3
 description TO-CORE1
 ip address 10.0.2.9/31
 ip ospf area 0.0.0.0
 ip ospf cost 20
!
router ospf
 ospf router-id 10.255.0.32
 passive-interface lo
!
line vty
!
