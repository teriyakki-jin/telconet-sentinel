frr version 10.7.0
frr defaults traditional
hostname agg2
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.22/32
 ip ospf area 0.0.0.0
!
interface eth1
 description TO-ACCESS1
 ip address 10.0.1.3/31
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 100
!
interface eth2
 description TO-ACCESS2
 ip address 10.0.1.7/31
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 10
!
interface eth3
 description TO-CORE1-BACKUP
 ip address 10.0.2.4/31
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 100
!
interface eth4
 description TO-CORE2-PRIMARY
 ip address 10.0.2.6/31
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf cost 10
!
router ospf
 ospf router-id 10.255.0.22
 passive-interface lo
!
line vty
!
