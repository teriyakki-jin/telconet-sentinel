name: containerlab E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lab-e2e.yml"
      - "lab/**"
      - "scenarios/**"
      - "src/**"
      - "tests/contract/test_live_e2e.py"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/lab-e2e.yml"
      - "lab/**"
      - "scenarios/**"
      - "src/**"
      - "tests/contract/test_live_e2e.py"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "17 19 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containerlab-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLAB_VERSION: "0.79.0"
      CLAB_SHA256: "f90d36d58bb6c4afd3b3a4dca006b81594c6d16f7a04be0184b03f44291085a2"
      TELCONET_CLAB_SUDO: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Install verified containerlab release
        shell: bash
        run: |
          archive="containerlab_${CLAB_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "https://github.com/srl-labs/containerlab/releases/download/v${CLAB_VERSION}/${archive}"
          echo "${CLAB_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp containerlab
          sudo install -m 0755 /tmp/containerlab /usr/local/bin/containerlab
          containerlab version

      - name: Run live convergence E2E
        run: bash scenarios/live_convergence_e2e.sh

      - name: Upload lab evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-convergence-evidence
          path: |
            artifacts/live-convergence
          if-no-files-found: warn
          retention-days: 14
