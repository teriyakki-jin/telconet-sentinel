name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q --cov=telconet_sentinel --cov-branch --cov-fail-under=80
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: bash -n scenarios/*.sh
      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "${PWD}/observability/prometheus/rules:/etc/prometheus/rules:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/observability/prometheus/rules:/etc/prometheus/rules:ro" \
            -v "${PWD}/observability/prometheus/tests:/etc/prometheus/tests:ro" \
            prom/prometheus:v3.14.0 \
            test rules /etc/prometheus/tests/convergence.yml
